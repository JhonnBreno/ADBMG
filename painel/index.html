<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - ADBMG</title>
    <link rel="stylesheet" href="../style.css"> <!-- Ajuste o caminho conforme necessário -->
    <link rel="stylesheet" href="../home/profile.css"> <!-- Pode reutilizar o CSS de perfil para alguns estilos -->
    <link rel="shortcut icon" href="../imagens/favicon-adbmg.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container-fluid fundo">
        <div class="header">
        <img src="../imagens/adblogo.jpg" alt="">
        <h1 class="mb-4">Painel de Administração de Usuários</h1>
        <div class="settings">⚙️</div>
    </div>
        <div class="num-users"><p>Total de Usuários: <span id="userCount">0</span></p></div>

        <div class="input-group mb-3">
            <input type="text" class="form-control" id="searchCongregacao" placeholder="Buscar por Nome Completo">
            <select class="form-select" id="filterBatizado">
                <option value="">Filtrar por Batizado</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>
            <select class="form-select" id="filterCidade">
                <option value="">Filtrar por Cidade</option>
                <option value="Quixeramobim">Quixeramobim</option>
                <option value="Morada Nova">Morada Nova</option>
                <option value="Russas">Russas</option>
                <option value="Limoeiro do Norte">Limoeiro do Norte</option>
                <option value="Quixadá">Quixadá</option>
            </select>

        </div>

        <div id="userList" class="row users">
            <!-- Dados dos usuários serão carregados aqui -->
        </div>
    </div>
    <div class="footer">
        <p>&hkswarow; As insformações que aqui estão são usadas com muito cuidado apenas usuários autorizados podem ter acesso a essa página</p>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
